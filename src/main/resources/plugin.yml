name: ThunderLBs
version: '${version}'
main: exposed.thunder.thunderLBs.ThunderLBs
api-version: '1.19'
folia-supported: true
authors: [ thunderredstar ]
website: https://docs.thunder.exposed
softdepend:
  - PlaceholderAPI
  - Topper
  - GroupTopper
  - TimedTopper
  - ajLeaderboards
  - packetevents
  - ViaVersion
  - ViaBackwards
  # Custom-font plugins, so their glyph widths can be read for <pad:...> columns.
  - Nexo
  - Oraxen
  - ItemsAdder
commands:
  leaderboards:
    description: Manage ThunderLBs
    usage: /<command> help
    aliases: [lb]
    permission: thunderlbs.admin
permissions:
  thunderlbs.admin:
    description: Allows managing ThunderLBs
    default: op
