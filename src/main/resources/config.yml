############################
# ThunderLBs configuration #
############################

# Used for automatic configuration upgrades. Do not change this.
config-version: 8

# How leaderboards are shown to players.
#   packet: the default when PacketEvents is installed. These aren't spawned
#           in the world itself and should mean less server thread usage.
#   entity: real text display entities are spawned in the world. Use this only
#           if packet mode doesn't work on your setup.
# If packet is selected without PacketEvents installed, it'll fall back to entity mode.
render:
  mode: packet
  # How close (in blocks) a player has to be to see a leaderboard.
  # Can be overridden per board with /lb edit <id> viewdistance <blocks>.
  view-distance: 48
  # Width in Minecraft font pixels at which a line wraps onto the next one.
  # This has to clear formatting.padding.target below (150) plus whatever the
  # row draws after the column, so raising one usually means raising the other.
  # /lb doctor prints the width each board actually needs, and
  # /lb edit <id> linewidth <pixels> overrides it for one board.
  line-width: 250
  # How each line sits relative to the display's anchor point:
  #   center: the vanilla default, and what every existing board looks like.
  #   left:   required for <pad:...> columns to line up, because centered rows
  #           of different total width get different left edges.
  #   right:  lines are flush right instead.
  # Overridable per board with /lb edit <id> alignment <center|left|right>.
  alignment: center

# Where leaderboard data comes from. Built in: topper, ajleaderboards,
# timedtopper. Built-ins use native plugin APIs; PlaceholderAPI-backed custom
# providers live in providers.yml.
provider: topper

missing-text: "---"
# Position shown on the private relative line when the provider has no data for
# the viewing player. Unlike normal positions, this is displayed without a #.
missing-position: "-1"

# Defaults applied to newly created leaderboards.
defaults:
  positions: 10
  page-duration-ticks: 160
  interval-ticks: 200
  row-delay-ticks: 2
  typing-interval-ticks: 1
  row-spacing: 0.325
  row-start-offset: -0.8
  bar-offset-y: -0.5
  relative-offset: -0.3
  cleanup-on-start: true

# Runtime refresh controls. Higher values reduce placeholder and scheduler work
# at the cost of slower viewer-relative value updates. 20 ticks equal one second.
performance:
  relative-refresh-ticks: 40

  # Resolved leaderboard values are cached, so rendering never waits on a provider.
  # This is how long a cached top-row value stays fresh before it is refreshed in the
  # background; viewer-relative values use relative-refresh-ticks above instead.
  provider-cache-ttl-ticks: 100

  # Refresh Topper and ajLeaderboards values off the main thread. Both are
  # thread-safe, so there is no reason to turn this off.
  async-providers: true

  # Refresh PlaceholderAPI values off the main thread. Whether that is safe depends
  # on the expansions you have installed, not on ThunderLBs. If an expansion starts
  # throwing "Asynchronous ... access" errors or a ConcurrentModificationException,
  # set this to false: refreshes then run on the thread that owns their context —
  # viewer values on that player's region thread, shared values on the main thread
  # (the global region on Folia).
  async-papi: true

  # Packet backend only: serialize each board update once and send the same bytes to
  # every viewer, instead of re-encoding the packet per player. Per-client handling
  # such as ViaVersion still applies, because the shared bytes pass through each
  # player's connection individually. Safe to leave on: if the fast path does not
  # match the installed packetevents build, the plugin logs a warning once and falls
  # back to per-player sends on its own.
  shared-packet-serialization: true

# The bar shown between the title and the rows.
#   dots: one symbol per page. Pages that have already been shown use their
#         holder color, upcoming ones use the pending color.
#   bar:  a single line that fills up while the page is on screen.
#   none: no bar.
bar:
  mode: dots
  symbol: "⏺"
  separator: " "
  # Used for dots whose page has not been shown yet.
  pending-color: "dark_gray"
  # When false, shown dots (and the fill bar) use active-color instead of the
  # holder color.
  use-holder-color: true
  active-color: "#FFFFFF"
  # Only used when mode is "bar". PlaceholderAPI placeholders work here and
  # resolve without a player, so use server-wide ones such as %server_online%.
  background: "<#4D4D4D><st>                    </st>"
  foreground: "<#CFCFCF><st>                    </st>"

formatting:
  # Holder colors may be a named MiniMessage color, a #RRGGBB color, or a
  # 2-10 stop gradient such as #FF2929:#FF8A00:#FFE600.
  #
  # PlaceholderAPI placeholders may be written straight into these formats, and
  # each resolves against the player that line is about:
  #   row: "...<white>%vault_prefix%%player%</white>..."
  #   -> "1. [VIP] Makeinen545 -> 42"
  # In row, that is the player on that line (no player for a group leaderboard
  # or an empty slot); in relative, the viewer reading it; in title, nobody, so
  # only server-wide placeholders apply there. Placeholders resolve before any
  # padding is measured, so a <pad:...> column still lines up. Legacy & and
  # section-sign codes an expansion returns are converted, and bold text is
  # measured as bold (italic does not change width in Minecraft). ThunderLBs'
  # own tokens above are left alone -- PlaceholderAPI only expands identifiers
  # containing an underscore.
  title: "<color:%color%>%icon%</color> <bold><color:%color%>%title%</color></bold>"
  row: "<color:%color%>%position%</color> <white>%player%</white> <dark_gray>→</dark_gray> <color:%color%>%value%</color>"
  relative: "<color:%color%>%position%</color> <white>%player%</white> <dark_gray>→</dark_gray> <color:%color%>%value%</color>"
  # Override %color% in the row format for specific positions, e.g. gold,
  # silver and bronze for the top three. Positions not listed here keep the
  # page's color. Also applies to the relative line when the viewer holds one
  # of these ranks. Replace {} with the example values below to enable it.
  # Both rank-colors and circled-numbers can also be set per leaderboard in
  # the formatting section of its file, overriding the values here.
  rank-colors: {}
  # rank-colors:
  #   1: "#FFD700"
  #   2: "#C0C0C0"
  #   3: "#CD7F32"
  circled-numbers:
    - "①"
    - "②"
    - "③"
    - "④"
    - "⑤"
    - "⑥"
    - "⑦"
    - "⑧"
    - "⑨"
    - "⑩"
  # Column alignment. Put <pad:...> in any title, row or relative format and
  # ThunderLBs measures the visible text before it in Minecraft font pixels,
  # then inserts filler until that column is reached:
  #   row: "...<white>%player%</white><pad:150:.><color:%color%>%value%</color>"
  #   -> "1. Makeinen545..............x50 (MAX)"
  #
  # <pad[:TARGET[:FILLER[:MODE[:STYLE]]]]>
  #   TARGET - column in pixels (1-4096), or +N for N pixels past the cursor
  #   FILLER - repeated characters; quote it if it contains : < > or spaces
  #   MODE   - fill (default) text after the tag STARTS at the column
  #            right         text after the tag ENDS at the column
  #   STYLE  - a color, a gradient, or %color% for the holder color
  # Anything omitted falls back to the values below.
  #
  # Text already past TARGET is left alone: no filler, and nothing is cut off.
  # Write \<pad> for a literal tag.
  padding:
    enabled: true
    # render.line-width (250) has to stay past this plus whatever follows the
    # column, or rows wrap onto a second line. Raise both together, and run
    # /lb doctor to see what each board needs.
    target: 150
    filler: "."
    mode: fill
    style: "dark_gray"
    # Every row of a page is widened to this width with invisible trailing
    # spaces. Without it a column still looks ragged: a text display always
    # centres its text on the hologram's anchor, so rows of different total width
    # begin at different x. (render.alignment cannot fix this -- it only arranges
    # lines within one display, and each row is a single line.)
    #   auto  the widest row on the page. Nothing to tune, but the whole board
    #         shifts a little whenever the widest row changes.
    #   <n>   a fixed width in pixels, which never shifts. A row wider than it is
    #         left alone, so pick something past your longest row.
    #   off   leave every row at its natural width.
    # auto only applies to a row format that really contains a <pad:...> tag, so
    # boards without one are untouched. A fixed width always applies.
    row-width: auto
    # Pixel widths for characters ThunderLBs cannot measure, such as glyphs from
    # a custom resource pack. Keys are the character itself or U+XXXX.
    glyph-widths: {}
    # glyph-widths:
    #   "U+E001": 12
    # Assumed width for any character still left without one.
    fallback-advance: 8

sounds:
  # Sound that plays during the "typing" animation on each board page's title.
  # Only the players who can currently see the board are sent it.
  typing:
    enabled: true
    key: "minecraft:block.note_block.hat"
    # Which volume slider in Options -> Music & Sounds controls this. Leave it on
    # master unless you want players to be able to mute the board separately:
    # ambient is the slider people turn off to silence cave sounds, and anything
    # played through it is inaudible to them.
    # master, music, record, weather, block, hostile, neutral, player, ambient, voice
    category: master
    volume: 0.5
    pitch-min: 1.85
    pitch-max: 2.0
    # How far away (in blocks) the click can still be heard. Unlike a plain world
    # sound, raising this does not make the sound louder up close -- volume above
    # is the only loudness control.
    radius: 16

# Animation configurations. You most likely don't need to touch these.
# https://easings.net/ if you do really want to...
animation:
  title:
    in:
      frames: 20
      easing: "EASE_OUT_BACK"
      scale: 1.5
      overshoot: 4.5
    out:
      frames: 20
      easing: "EASE_IN_SINE"
      scale: 1.5
  row:
    in:
      frames: 20
      easing: "EASE_OUT_CUBIC"
      start-offset: -1.25
      distance: 1.25
    out:
      frames: 20
      easing: "EASE_IN_CUBIC"
      distance: 1.25
  # Opacity reuses each title or row animation's frame count.
  opacity:
    in:
      easing: "LINEAR"
    out:
      easing: "LINEAR"
  bar:
    frames: 10
    easing: "LINEAR"
    translation-start: -1.0
    translation-end: 0.0

debug:
  placeholders: false
